<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#183f35"><link rel="manifest" href="manifest.json">
<title>Bob's Tai Chi</title>
<style>
:root{--bg:#f2f5f1;--card:#fff;--ink:#17342d;--green:#1f6654;--pale:#dfece5;--muted:#60746e}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.wrap{max-width:620px;margin:auto;padding:18px 16px 42px} header{text-align:center;padding:17px 0 10px} .mark{font-size:48px}
h1{font-size:32px;margin:2px} header p{margin:6px;color:var(--muted)} .card{background:#fff;border-radius:22px;padding:21px;margin:15px 0;box-shadow:0 5px 20px #17342d12}
.kicker{text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:800;color:var(--green)} h2{font-size:25px;margin:8px 0}
.meta,.teacher{color:var(--muted);line-height:1.4} .teacher{font-size:14px;margin-bottom:17px}
a.btn,button{display:block;width:100%;border:0;border-radius:16px;padding:17px;font-size:18px;font-weight:750;text-align:center;text-decoration:none;cursor:pointer}
.primary{background:var(--green);color:white} .secondary{background:var(--pale);color:var(--ink);margin-top:9px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px} .small{font-size:14px;padding:12px}
.progress{height:12px;background:#e6ece8;border-radius:20px;overflow:hidden;margin:12px 0 18px} .bar{height:100%;background:var(--green)}
.day{font-weight:750;margin-top:13px} .tip{font-size:13px;color:var(--muted);line-height:1.5}
#history div,#favorites div{border-bottom:1px solid #e6ebe8;padding:10px 0;font-size:14px}
.tabbar{display:grid;grid-template-columns:repeat(3,1fr);gap:7px} .tabbar button{font-size:13px;padding:11px}
.hidden{display:none}
</style></head><body><div class="wrap">
<header><div class="mark">☯︎</div><h1>Bob's Tai Chi</h1><p>90 days • intermediate Tai Chi • free video practice</p></header>

<section class="card" id="workoutCard">
<div class="kicker" id="phase"></div><h2 id="title"></h2>
<div class="meta" id="meta"></div><div class="teacher" id="teacher"></div>
<div class="day" id="day"></div><div class="progress"><div class="bar" id="bar"></div></div>
<a id="watch" class="btn primary" target="_blank" rel="noopener">▶ Play Today's Workout</a>
<button class="secondary" onclick="favorite()">★ Add to Favorites</button>
<button class="secondary" onclick="done()">✓ Finished — Go to Next Day</button>
</section>

<section class="card"><div class="kicker">Navigate your program</div>
<div class="grid"><button class="secondary small" onclick="prev()">← Previous Day</button><button class="secondary small" onclick="next()">Next Day →</button></div>
<button class="secondary small" onclick="randomWorkout()">↻ Surprise Me Today</button>
<p class="tip">Every button opens a specific free YouTube workout—no search-results pages. On your gym TV, use YouTube's Cast/AirPlay control when available.</p>
</section>

<section class="card"><div class="tabbar">
<button class="secondary small" onclick="showPanel('history')">History</button>
<button class="secondary small" onclick="showPanel('favorites')">Favorites</button>
<button class="secondary small" onclick="resetProgram()">Restart</button></div>
<div id="history"></div><div id="favorites" class="hidden"></div>
</section></div>

let day=parseInt(localStorage.getItem('bt_day')||'1'), surprise=null;
function cur(){return surprise!==null?workouts[surprise]:workouts[day-1]}
function render(){
 let x=cur(); phase.textContent=x.phase; title.textContent=x.title;
 meta.textContent=x.duration+' • '+x.focus; teacher.textContent=x.instructor;
 document.getElementById('day').textContent=surprise!==null?'Bonus workout':'Day '+day+' of 90';
 bar.style.width=(day/90*100)+'%'; watch.href=x.url; renderLists();
}
function next(){surprise=null;day=Math.min(90,day+1);save();render()}
function prev(){surprise=null;day=Math.max(1,day-1);save();render()}
function done(){
 let x=cur(),h=JSON.parse(localStorage.getItem('bt_history')||'[]');
 h.unshift({day:surprise!==null?'Bonus':day,title:x.title,date:new Date().toLocaleDateString()});
 localStorage.setItem('bt_history',JSON.stringify(h.slice(0,30))); surprise=null;
 if(day<90)day++;save();render();
}
function favorite(){
 let x=cur(),f=JSON.parse(localStorage.getItem('bt_favs')||'[]');
 if(!f.some(y=>y.url===x.url))f.push(x);localStorage.setItem('bt_favs',JSON.stringify(f));renderLists();
}
function randomWorkout(){surprise=Math.floor(Math.random()*workouts.length);render()}
function save(){localStorage.setItem('bt_day',day)}
function showPanel(id){history.classList.toggle('hidden',id!=='history');favorites.classList.toggle('hidden',id!=='favorites')}
function renderLists(){
 let h=JSON.parse(localStorage.getItem('bt_history')||'[]');
 history.innerHTML=h.length?h.map(x=>`<div>✓ ${x.day==='Bonus'?'Bonus':'Day '+x.day} — ${x.title}<br><small>${x.date}</small></div>`).join(''):'<div>No completed workouts yet.</div>';
 let f=JSON.parse(localStorage.getItem('bt_favs')||'[]');
 favorites.innerHTML=f.length?f.map(x=>`<div>★ <a href="${x.url}" target="_blank">${x.title}</a><br><small>${x.duration} • ${x.instructor}</small></div>`).join(''):'<div>No favorites yet.</div>';
}
function resetProgram(){if(confirm('Restart the 90-day program at Day 1?')){day=1;surprise=null;save();render()}}
render(); if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
